<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 代理订阅节点信息</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 380px;
            padding: 36px 32px 28px;
        }
        .login-card h1 {
            font-size: 20px;
            color: #2d3436;
            text-align: center;
            margin-bottom: 6px;
        }
        .login-card .subtitle {
            font-size: 13px;
            color: #636e72;
            text-align: center;
            margin-bottom: 22px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #2d3436;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }
        button {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { opacity: 0.92; }
        .banner {
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .banner-error { background: #ffeef0; color: #c0392b; border: 1px solid #f5c6cb; }
        .banner-msg { background: #e8f8f0; color: #1e8449; border: 1px solid #a9dfbf; }
        .hint {
            margin-top: 16px;
            font-size: 12px;
            color: #b2bec3;
            text-align: center;
            line-height: 1.7;
        }
    </style>
</head>
<body>
<div class="login-card">
    <h1>🌐 代理订阅节点信息</h1>
    <div class="subtitle">请登录后继续访问</div>

    <div class="banner banner-error" th:if="${error != null}" th:text="${error}">错误</div>
    <div class="banner banner-msg" th:if="${msg != null}" th:text="${msg}">消息</div>

    <!-- 表单登录：Spring Security 处理 POST /login，CSRF Token 由 Thymeleaf 自动注入隐藏域 -->
    <form th:action="@{/login}" method="post">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus>
        <label for="password">口令</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
        <button type="submit">登 录</button>
    </form>

    <div class="hint">
        未配置固定口令时，启动日志会打印一次性随机口令（或用环境变量 APP_PASSWORD 注入）。<br>
        本应用包含订阅中的节点凭据，请勿对公网直接暴露。
    </div>
</div>
</body>
</html>
