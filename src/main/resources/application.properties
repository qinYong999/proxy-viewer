# ============================================================
#  Proxy Subscription Viewer —— 默认配置
#  敏感项全部支持环境变量覆盖（${ENV:默认值}），仓库中不含任何真实口令。
#
#  本文件刻意不激活任何 profile（保持仓库中立）：
#    - 本地私有配置放 src/main/resources/application-dev.properties（已被 .gitignore 忽略）
#    - 通过运行参数激活：IDEA 用 VM options -Dspring.profiles.active=dev，
#      命令行用 --spring.profiles.active=dev 或环境变量 SPRING_PROFILES_ACTIVE=dev
# ============================================================

spring.application.name=proxy-subscription-viewer

# 仅监听本机回环地址，避免误暴露到公网；需要外部访问请自行改 SERVER_ADDRESS
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}

# 生产环境开启模板缓存；本地改模板时用 DEV 参数覆盖为 false
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# ---------------- MySQL ----------------
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/proxy_viewer?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA / Hibernate ----------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# 批量写入，降低"逐条 save"的写放大
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------------- 访问控制（默认开启） ----------------
# 口令留空时启动会随机生成并打印到日志；生产请用 APP_PASSWORD 注入
app.security.enabled=${APP_AUTH_ENABLED:true}
app.security.username=${APP_USERNAME:admin}
app.security.password=${APP_PASSWORD:}

# ---------------- 订阅抓取 ----------------
# 订阅链接是纯配置项：仓库不提供任何默认订阅地址。
# 请通过环境变量 SUBSCRIPTION_URL 注入，或直接在页面输入框填写后点击「更新节点」。
app.subscription.default-url=${SUBSCRIPTION_URL:}
# 是否允许订阅地址指向内网/回环地址（默认禁止，防 SSRF）
app.subscription.allow-private-hosts=${ALLOW_PRIVATE_SUBSCRIPTION_HOSTS:false}
# 依次尝试的代理（本地 v2rayN 默认端口），可用 REMOTE 前替换
app.subscription.proxy-candidates=${SUBSCRIPTION_PROXIES:socks5://127.0.0.1:10808,http://127.0.0.1:10809}
# 以上都失败时，用 DoH 手动解析 + 裸 SSLSocket 直连（绕过被污染的本地 DNS）
app.subscription.raw-socket-fallback-enabled=${RAW_SOCKET_FALLBACK:true}
app.subscription.doh-server-ip=${DOH_SERVER_IP:8.8.8.8}
app.subscription.doh-server-host=${DOH_SERVER_HOST:dns.google}
app.subscription.connect-timeout-seconds=20
app.subscription.request-timeout-seconds=30
# 抓取结果为空时保留旧数据，防止订阅临时失效清空数据库
app.subscription.keep-data-on-empty-result=true

# ---------------- 节点测试（真实代理测试） ----------------
# 原理与 v2rayN 的 Realping / Speedtest 同源：为节点生成真实内核配置、启动内核，
# 再经内核的本地 SOCKS 入站真实访问外网——测的是"这个代理能不能用"，
# 而不是"它的服务器端口开没开"。
#
# 代理内核（Xray）位置：留空则自动探测（PATH → core-dir → v2rayN 常见目录）。
# v2rayN 便携版通常带内核，可把 core-dir 指向它，例如：
#   app.test.core-dir=D:\path\to\v2rayN-windows-64\bin
app.test.core-path=${XRAY_PATH:}
app.test.core-dir=${XRAY_DIR:}
# 内核资源目录（geoip.dat / geosite.dat）；留空用内核所在目录
app.test.core-asset-dir=${XRAY_ASSET_DIR:}
# 就绪判定是真实的 SOCKS5 握手，不是盲等
app.test.core-startup-timeout-ms=8000
app.test.core-log-level=warning

# --- TCPing 快速预筛（不启动内核，成本极低）---
app.test.tcping-pre-filter=${TCPING_PREFILTER:true}
app.test.tcping-threads=50
app.test.tcping-timeout-ms=5000

# --- 真实延迟（每节点独立内核）---
# 并发内核数：过高会耗尽端口/句柄并互相干扰
app.test.latency-concurrency=${TEST_LATENCY_CONCURRENCY:8}
# 探测地址要求返回 204/200，否则判为失败（节点被墙时常见 403/502）
app.test.latency-test-url=${LATENCY_TEST_URL:http://cp.cloudflare.com/generate_204}
app.test.latency-timeout-ms=5000
# 连测次数并取最小值，抑制单次抖动
app.test.latency-attempts=2
app.test.latency-attempt-interval-ms=100

# --- 下载测速（仅对延迟通过的节点，独立限并发）---
app.test.speed-test-enabled=${SPEED_TEST_ENABLED:true}
app.test.speed-test-url=${SPEED_TEST_URL:https://speed.cloudflare.com/__down?bytes=50000000}
# 限时下载，到点即中断；速度单位为 Kbps
app.test.speed-test-duration-ms=10000
app.test.speed-test-timeout-ms=15000
app.test.speed-concurrency=3

# --- UDP 可用性（经 SOCKS5 UDP ASSOCIATE 发 NTP 探测）---
# 能识别"TCP 通但 UDP 被阻断"的节点；默认关闭以免拖慢整批测试
app.test.udp-test-enabled=${UDP_TEST_ENABLED:false}
app.test.udp-test-target=ntp:pool.ntp.org
app.test.udp-test-timeout-ms=5000

# 连续失败 N 次才自动删除；0 = 永不自动删除（失败只打标记，由页面手动清理）
app.test.auto-delete-after-failures=${AUTO_DELETE_AFTER_FAILURES:0}
app.test.schedule-enabled=${TEST_SCHEDULE_ENABLED:true}
app.test.schedule-fixed-rate-ms=21600000
app.test.schedule-initial-delay-ms=3600000
